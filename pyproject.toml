[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflatform-pipeline"
version = "0.1.0"
description = "멀티모달 데이터 통합 플랫폼 — 처리 파이프라인(Airflow: 수집·분류·추출·임베딩·적재·색인·관계 생성)"
requires-python = ">=3.11"
dependencies = [
    # ⚠️ 코어(src.*)는 여기 핀하지 않는다 — README §9 대로 별도 설치:
    #   설치형: pip install "meta-extract @ git+https://github.com/OWNER/dataplatform-core.git@<tag>"
    #   참조형: pip install -e /path/to/dataplatform-core
    # 코어를 설치하면 코어 런타임(psycopg·numpy·torch·transformers·pillow·opensearch-py 등)이
    # **전이로** 온다 → 여기엔 코어가 제공하지 않는 '파이프라인 전용'만 나열(AST 스캔 근거·078 일원화).
    # ※ apache-airflow 는 베이스 이미지(apache/airflow)가 제공하므로 어느 목록에도 없다(핀 충돌 방지).
    "opencv-python>=4.9.0",   # processing/preprocess (cv2 — 키프레임 dedup·video_keyframes)
    "faster-whisper>=1.0.0",  # processing/preprocess/stt.py (STT)
    "scenedetect>=0.6.2",     # processing/preprocess/video_keyframes.py (장면 분할)
    "soundfile>=0.12.1",      # processing/extractors/audio_meta_extractor.py
    "pytesseract>=0.3.10",    # processing/classify/text_probe.py (이미지 OCR·lazy import)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["processing*"]

[tool.ruff]
line-length = 100
lint.ignore = ["E501"]  # 코어 레포 관례와 동일(한국어 주석 다수·E501 무시)

[tool.ruff.lint.isort]
known-first-party = ["processing", "src"]  # 파이프라인(processing)·코어(src) 모두 first-party 정렬
